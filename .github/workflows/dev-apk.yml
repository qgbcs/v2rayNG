name: Dev APK (MQTT VPN)

# MQTT VPN 开发迭代专用：dev 分支 push / 手动触发即出 debug 签名 APK。
#
# 关键点：dev 分支是纯代码分支（无 res/资源、无 wrapper jar），不能直接出包。
# 策略 = checkout 完整 master（含 res 与真子模块，源码版本天然一致），
# 再把 dev 的代码改动叠加上去（排除 hev-socks5-tunnel / AndroidLibXrayLite
# 两个子模块目录，防止拍平的混合版本覆盖 master 的一致检出）。
# 产物 debug 签名 APK 上传 artifact，无需任何 secrets。

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout master (full resources + submodules)
      uses: actions/checkout@v7
      with:
        ref: master
        submodules: 'recursive'
        fetch-depth: '0'

    - name: Overlay dev branch code
      run: |
        git fetch origin dev
        git checkout dev -- . ':(exclude)hev-socks5-tunnel' ':(exclude)AndroidLibXrayLite'
        echo '--- overlaid files (top) ---'
        git status --short | head -30

    - name: Setup Android SDK
      uses: android-actions/setup-android@v4
      with:
        log-accepted-android-sdk-licenses: false
        cmdline-tools-version: '14742923'
        packages: 'platforms;android-37.0 build-tools;37.0.0 platform-tools'

    - name: Install NDK
      run: |
        echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          --channel=0 \
          --install "ndk;30.0.16248370"
        echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> $GITHUB_ENV

    - name: Ensure python3.13 for Chaquopy buildPython
      run: |
        if [ ! -x /usr/bin/python3.13 ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3.13 python3.13-venv python3-pip || true
          if [ ! -x /usr/bin/python3.13 ]; then
            sudo ln -sf "$(command -v python3.13 || echo /usr/bin/python3)" /usr/bin/python3.13
          fi
        fi
        /usr/bin/python3.13 -V

    - name: Build libhevtun
      run: |
        bash compile-hevtun.sh
        cp -r "$GITHUB_WORKSPACE/libs" "$GITHUB_WORKSPACE/V2rayNG/app"

    - name: Download libv2ray.aar
      run: |
        CURRENT_TAG=$(git -C AndroidLibXrayLite describe --tags --abbrev=0)
        echo "AndroidLibXrayLite tag: $CURRENT_TAG"
        mkdir -p V2rayNG/app/libs
        curl -fsSL --retry 3 \
          -o V2rayNG/app/libs/libv2ray.aar \
          "https://github.com/2dust/AndroidLibXrayLite/releases/download/$CURRENT_TAG/libv2ray.aar"

    - name: Setup Java
      uses: actions/setup-java@v6.1.0
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build debug APK
      run: |
        cd "$GITHUB_WORKSPACE/V2rayNG"
        echo "sdk.dir=${ANDROID_HOME}" > local.properties
        chmod 755 gradlew
        ./gradlew assemblePlaystoreDebug -PABI_FILTERS=arm64-v8a

    - name: Upload arm64-v8a debug APK
      uses: actions/upload-artifact@v7
      if: ${{ success() }}
      with:
        name: dev-apk
        path: ${{ github.workspace }}/V2rayNG/app/build/outputs/apk/playstore/debug/*.apk
